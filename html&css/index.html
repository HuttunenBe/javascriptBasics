<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Page</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>

    <!-- Navigation -->

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li> <!-- index.html / id name #home -->
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!--- Form -->

    <form>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      />
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" />
    </form>

    <!--- Radio selector --->

    <p>Choose a subscription:</p>
    <label for="basic">Basic</label>
    <input type="radio" id="basic" name="subscription" value="basic" />
    <label for="basic">Premium</label>
    <input type="radio" id="premium" name="subscription" value="premium" />
    <button>Submit</button>

    <!---- Select ---->

    <p>Select your country:</p>
    <select name="country" id="country">
      <option value="finland">Finland</option>
      <option value="sweden">Sweden</option>
      <option value="norway">Norway</option>
    </select>
    <button type="submit">Submit</button>

    <!--- Basic list -->

    <ul>
      <li>Option 1</li>
      <li>Option 2</li>
      <li>Option 3</li>
    </ul>

    <!--- Link to google --->

    <a href="https://www.google.com" target="_blank"> Go to Google </a>
    <script src="main.js"></script>
  </body>
</html>
